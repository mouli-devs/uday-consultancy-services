  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <g transform="translate(200, 125)">
    <rect x="-50" y="-35" width="100" height="60" rx="5" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="url(#accent)">17025</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial" font-size="10" font-weight="600" fill="url(#accent)">SUPPORT</text>
  </g>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#c89b2c" font-weight="600">ISO/IEC 17025:2017 Support</text>
