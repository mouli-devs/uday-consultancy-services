<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12386b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#061528;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c89b2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c56d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <g transform="translate(200, 125)">
    <rect x="-45" y="-35" width="90" height="60" rx="3" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="25" cy="-25" r="12" fill="url(#accent)"/>
    <text x="25" y="-20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#061528">✓</text>
  </g>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#c89b2c" font-weight="600">Internal Audit</text>
</svg>